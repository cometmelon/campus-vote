# render.yaml — One-click deploy for Render
# Usage: Connect your GitHub repo on Render, it auto-detects this file

databases:
  - name: campusvote-db
    plan: free
    databaseName: campusvote
    user: campusvote

services:
  # Backend API
  - type: web
    name: campusvote-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusvote-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        value: https://campusvote.onrender.com
      - key: PYTHON_VERSION
        value: "3.11"

  # Frontend Static Site
  - type: web
    name: campusvote
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://campusvote-api.onrender.com
